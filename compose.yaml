name: crystal

# Database-per-service: har bir servisning O‘Z PostgreSQL serveri, O‘Z foydalanuvchisi,
# O‘Z volume’i va O‘Z yopiq tarmog‘i bor. Masalan, courier-service order-db’ga
# tarmoq darajasida ham ulana olmaydi.
#
#   edge ──> gateway ──backend──> order / courier / tracking ──events──> rabbitmq
#                                   │         │          │
#                              order-data courier-data tracking-data   (internal)
#                                   │         │          │
#                               order-db  courier-db  tracking-db

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s
  logging: *logging

x-service: &service
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 10s
  logging: *logging

x-broker-url: &broker-url amqp://${RABBITMQ_USER:-crystal}:${RABBITMQ_PASSWORD:-crystal_dev_password}@rabbitmq:5672/%2F

services:
  # ---------------- ma’lumotlar bazalari ----------------
  order-db:
    <<: *postgres
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: order
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_dev_password}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks: [order-data]

  courier-db:
    <<: *postgres
    environment:
      POSTGRES_DB: courier
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: ${COURIER_DB_PASSWORD:-courier_dev_password}
    volumes:
      - courier-db-data:/var/lib/postgresql/data
    networks: [courier-data]

  tracking-db:
    <<: *postgres
    environment:
      POSTGRES_DB: tracking
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: ${TRACKING_DB_PASSWORD:-tracking_dev_password}
    volumes:
      - tracking-db-data:/var/lib/postgresql/data
    networks: [tracking-data]

  # ---------------- xabar brokeri ----------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crystal}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-crystal_dev_password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"   # boshqaruv paneli, faqat lokal
    networks: [events, edge]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging: *logging

  # ---------------- servislar ----------------
  order-service:
    <<: *service
    build:
      context: .
      target: runtime
      args:
        SERVICE: order
    image: crystal-order-service:local
    environment:
      CRYSTAL_DATABASE_URL: postgresql://order:${ORDER_DB_PASSWORD:-order_dev_password}@order-db:5432/order
      CRYSTAL_BROKER_URL: *broker-url
      CRYSTAL_COURIER_SERVICE_URL: http://courier-service:8000
      CRYSTAL_LOG_LEVEL: ${CRYSTAL_LOG_LEVEL:-INFO}
    depends_on:
      order-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [order-data, events, backend]

  courier-service:
    <<: *service
    build:
      context: .
      target: runtime
      args:
        SERVICE: courier
    image: crystal-courier-service:local
    environment:
      CRYSTAL_DATABASE_URL: postgresql://courier:${COURIER_DB_PASSWORD:-courier_dev_password}@courier-db:5432/courier
      CRYSTAL_BROKER_URL: *broker-url
      CRYSTAL_ORDER_SERVICE_URL: http://order-service:8000
      CRYSTAL_LOG_LEVEL: ${CRYSTAL_LOG_LEVEL:-INFO}
    depends_on:
      courier-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [courier-data, events, backend]

  tracking-service:
    <<: *service
    build:
      context: .
      target: runtime
      args:
        SERVICE: tracking
    image: crystal-tracking-service:local
    environment:
      CRYSTAL_DATABASE_URL: postgresql://tracking:${TRACKING_DB_PASSWORD:-tracking_dev_password}@tracking-db:5432/tracking
      CRYSTAL_BROKER_URL: *broker-url
      CRYSTAL_LOG_LEVEL: ${CRYSTAL_LOG_LEVEL:-INFO}
    depends_on:
      tracking-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [tracking-data, events, backend]

  # ---------------- yagona kirish nuqtasi ----------------
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${CRYSTAL_PUBLISH_PORT:-8000}:8080"
    depends_on:
      order-service: {condition: service_healthy}
      courier-service: {condition: service_healthy}
      tracking-service: {condition: service_healthy}
    networks: [edge, backend]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging

networks:
  edge: {}
  backend:
    internal: true
  events:
    internal: true
  order-data:
    internal: true
  courier-data:
    internal: true
  tracking-data:
    internal: true

volumes:
  order-db-data:
  courier-db-data:
  tracking-db-data:
  rabbitmq-data:
