name: Crystal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test order lifecycle
        run: python3 -m unittest discover -s tests -v
      - name: Build and run the container
        run: |
          docker build --tag crystal-logistics .
          docker run --rm crystal-logistics
