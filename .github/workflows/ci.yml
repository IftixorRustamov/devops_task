name: Crystal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit va integratsion testlar
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Testlar (SQLite + xotiradagi shina, tashqi kutubxonasiz)
        run: python -m unittest discover -s tests -v

  stack:
    name: To‘liq stack (PostgreSQL x4 + RabbitMQ + gateway)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: compose.yaml tekshiruvi
        run: docker compose config --quiet
      - name: Obraz ichida testlar
        run: docker build --target test --tag crystal-logistics:test .
      - name: Stack’ni ko‘tarish
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Holat
        run: docker compose ps
      - name: Smoke test (gateway orqali)
        run: ./scripts/smoke_test.sh http://localhost:8000
      - name: Resilience test (izolyatsiya, outbox, saqlanish)
        run: ./scripts/resilience_test.sh http://localhost:8000
      - name: Loglar
        if: always()
        run: docker compose logs --no-color
      - name: Tozalash
        if: always()
        run: docker compose down --volumes

  codespace:
    name: Codespaces muhiti (devcontainer)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Devcontainer’ni ko‘tarish va ichida stack + smoke test
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -e
            for i in $(seq 1 60); do curl -fsS http://localhost:8000/health/order >/dev/null 2>&1 && break; sleep 5; done
            docker compose ps
            ./scripts/smoke_test.sh http://localhost:8000
