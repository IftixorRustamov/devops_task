# API Gateway: yagona kirish nuqtasi (:8080 konteyner ichida, hostda CRYSTAL_PUBLISH_PORT).
# Mijoz servislar qayerda ekanini bilmaydi; marshrutlash va autentifikatsiya shu yerda.
#
# Autentifikatsiya (secure by default): HAR BIR so‘rov `auth_request` bilan auth-service’da
# tekshiriladi; faqat `auth_request off;` yozilgan joylar ommaviy. Token to‘g‘ri bo‘lsa
# servisga X-User va X-User-Role sarlavhalari qo‘yiladi. Mijoz yuborgan X-User* sarlavhalari
# har doim ustidan yoziladi (ommaviy yo‘llarda — olib tashlanadi), ularni soxtalashtirib bo‘lmaydi.

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format crystal_json escape=json
    '{"ts":"$time_iso8601","service":"gateway","request_id":"$req_id",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"user":"$auth_user","upstream":"$upstream_addr","duration_s":$request_time}';

limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;   # parol tanlashga qarshi

# Servis manzillari har so‘rovda Docker DNS orqali aniqlanadi (5 s kesh).
# `upstream { server … }` IP’ni faqat ishga tushishda oladi — servis qayta yaratilsa
# eski IP boshqa konteynerga berilib, so‘rov NOTO‘G‘RI servisga ketishi mumkin.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout crystal_json;
    error_log /dev/stderr warn;

    client_max_body_size 64k;
    default_type application/json;

    limit_req zone=api burst=100 nodelay;
    limit_req_status 429;

    set $auth_service     auth-service:8000;
    set $order_service    order-service:8000;
    set $courier_service  courier-service:8000;
    set $tracking_service tracking-service:8000;

    # --- autentifikatsiya: standart holatda hamma yo‘l himoyalangan ---
    auth_request /_auth;
    auth_request_set $auth_user $upstream_http_x_user;
    auth_request_set $auth_role $upstream_http_x_user_role;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-User $auth_user;
    proxy_set_header X-User-Role $auth_role;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;

    add_header X-Request-ID $req_id always;
    add_header X-Content-Type-Options nosniff always;

    error_page 401 = @unauthorized;
    error_page 500 502 503 504 = @unavailable;
    error_page 429 = @too_many;
    error_page 413 = @too_large;

    location = /_auth {
        internal;
        auth_request off;
        proxy_pass http://$auth_service/internal/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header Authorization $http_authorization;
    }

    # --- ommaviy ---
    # Namoyish sahifasi (o‘qituvchiga ko‘rsatish uchun): faqat statik HTML, API’ni brauzerdan chaqiradi.
    location = / {
        auth_request off;
        root /usr/share/nginx/demo;
        try_files /index.html =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }
    location = /health { return 200 '{"status":"ok","service":"gateway"}'; }
    location = /health/auth     { auth_request off; proxy_pass http://$auth_service/health; }
    location = /health/order    { auth_request off; proxy_pass http://$order_service/health; }
    location = /health/courier  { auth_request off; proxy_pass http://$courier_service/health; }
    location = /health/tracking { auth_request off; proxy_pass http://$tracking_service/health; }

    location ~ ^/api/v1/auth/(login|refresh|logout)/?$ {
        auth_request off;
        limit_req zone=login burst=30 nodelay;
        proxy_pass http://$auth_service;
    }
    location /api/v1/tracking/ { auth_request off; proxy_pass http://$tracking_service; }

    # Servislararo endpointlar tashqariga ochilmaydi.
    location /internal/ { return 404 '{"error":"Manzil topilmadi."}'; }

    # --- himoyalangan (token kerak; rolni servisning o‘zi tekshiradi) ---
    location /api/v1/auth/     { proxy_pass http://$auth_service; }
    location /api/v1/couriers/ { proxy_pass http://$courier_service; }
    location ~ ^/api/v1/orders/[A-Za-z0-9-]+/assign/?$ { proxy_pass http://$courier_service; }
    location /api/v1/          { proxy_pass http://$order_service; }

    location / { return 404 '{"error":"Manzil topilmadi."}'; }

    location @unauthorized { return 401 '{"error":"Avtorizatsiya kerak: token yo‘q, noto‘g‘ri yoki muddati o‘tgan."}'; }
    location @unavailable  { return 503 '{"error":"Servis vaqtincha mavjud emas."}'; }
    location @too_many     { return 429 '{"error":"So‘rovlar juda ko‘p, keyinroq urinib ko‘ring."}'; }
    location @too_large    { return 413 '{"error":"So‘rov hajmi juda katta."}'; }
}
