# API Gateway: yagona kirish nuqtasi (:8080 konteyner ichida, hostda CRYSTAL_PUBLISH_PORT).
# Mijoz servislar qayerda ekanini bilmaydi; marshrutlash shu yerda.

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format crystal_json escape=json
    '{"ts":"$time_iso8601","service":"gateway","request_id":"$req_id",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"upstream":"$upstream_addr","duration_s":$request_time}';

limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

upstream order_service    { server order-service:8000;    keepalive 16; }
upstream courier_service  { server courier-service:8000;  keepalive 16; }
upstream tracking_service { server tracking-service:8000; keepalive 16; }

server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout crystal_json;
    error_log /dev/stderr warn;

    client_max_body_size 64k;
    default_type application/json;

    limit_req zone=api burst=100 nodelay;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;

    add_header X-Request-ID $req_id always;
    add_header X-Content-Type-Options nosniff always;

    error_page 502 503 504 = @unavailable;
    error_page 429 = @too_many;
    error_page 413 = @too_large;

    location = /health { return 200 '{"status":"ok","service":"gateway"}'; }
    location = /health/order    { proxy_pass http://order_service/health; }
    location = /health/courier  { proxy_pass http://courier_service/health; }
    location = /health/tracking { proxy_pass http://tracking_service/health; }

    # Servislararo endpointlar tashqariga ochilmaydi.
    location /internal/ { return 404 '{"error":"Manzil topilmadi."}'; }

    # Kuryer biriktirish — courier-service; buyurtmaning qolgan amallari — order-service.
    location ~ ^/api/v1/orders/[A-Za-z0-9-]+/assign/?$ { proxy_pass http://courier_service; }
    location /api/v1/tracking/ { proxy_pass http://tracking_service; }
    location /api/v1/          { proxy_pass http://order_service; }

    location / { return 404 '{"error":"Manzil topilmadi."}'; }

    location @unavailable { return 503 '{"error":"Servis vaqtincha mavjud emas."}'; }
    location @too_many    { return 429 '{"error":"So‘rovlar juda ko‘p, keyinroq urinib ko‘ring."}'; }
    location @too_large   { return 413 '{"error":"So‘rov hajmi juda katta."}'; }
}
