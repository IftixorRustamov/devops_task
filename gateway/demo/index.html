<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Crystal Logistics</title>
<style>
/* ============ Tokenlar (sabablari: docs/design.md) ============ */
:root {
  --canvas: #EEF2F7;  --surface: #FFFFFF;  --sunken: #F4F6FA;
  --ink: #172036;     --ink-2: #5A6478;    --ink-3: #A3ABBB;
  --brand: #2C62DE;   --brand-50: #EBF1FF; --brand-100: #DCE6FF; --brand-700: #2453C4;
  --danger: #B42318;  --danger-50: #FDECEA;

  --new: #4B5568;     --new-50: #EEF1F5;
  --ware: #94600A;    --ware-50: #FFF3DC;
  --transit: #2453C4; --transit-50: #E8EEFF;
  --done: #12784A;    --done-50: #E3F6EC;

  --r-input: 14px; --r-btn: 16px; --r-card: 22px; --r-pill: 999px;
  --shadow-card: 0 1px 2px rgba(23,32,54,.04), 0 12px 32px -16px rgba(23,32,54,.18);
  --shadow-pop: 0 18px 44px -14px rgba(23,32,54,.32);
  --ring: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 var(--font); letter-spacing: -0.006em; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ============ Ilova karkasi ============ */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.sidebar { padding: 22px 16px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.logo { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.logo-mark { width: 30px; height: 30px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; color: #fff; box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--brand) 80%, transparent); }
.nav { display: grid; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border: 0; background: none; border-radius: 14px; cursor: pointer; font-weight: 600; color: var(--ink-2); text-align: left; }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.nav-item:hover { background: rgba(255,255,255,.6); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); }
.nav-item[aria-current="page"] svg { color: var(--brand); }
.nav-item:focus-visible, .btn:focus-visible, .chip-btn:focus-visible, .row-btn:focus-visible, .icon-btn:focus-visible { outline: none; box-shadow: var(--ring); }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-card); }
.avatar { width: 36px; height: 36px; flex: none; border-radius: 12px; background: var(--brand-50); color: var(--brand-700); display: grid; place-items: center; font-weight: 700; text-transform: uppercase; }
.me-name { font-weight: 650; font-size: 14px; line-height: 1.2; }
.me-role { font-size: 13px; color: var(--ink-2); }
.icon-btn { margin-left: auto; width: 36px; height: 36px; border: 0; border-radius: 12px; background: var(--sunken); color: var(--ink-2); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { color: var(--ink); background: var(--brand-50); }
.icon-btn svg { width: 18px; height: 18px; }

.main { padding: 28px 32px 48px; max-width: 1180px; width: 100%; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; min-height: 44px; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.025em; }
.meta { font-size: 13px; color: var(--ink-2); }

@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: relative; height: auto; padding: 14px 16px 0; gap: 12px; min-width: 0; }
  .nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding: 2px 2px 8px; min-width: 0; scrollbar-width: none; }
  .nav-item { height: 40px; }
  .me { position: absolute; top: 10px; right: 12px; padding: 4px; box-shadow: none; background: none; }
  .me .avatar, .me-text { display: none; }
  .main { padding: 16px 16px 40px; }
  .page-title { font-size: 22px; }
}

/* ============ Komponentlar ============ */
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: 22px; }
.card-title { font-size: 16px; font-weight: 650; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grid { display: grid; gap: 20px; }
.cols-2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 1020px) { .cols-2 { grid-template-columns: minmax(0, 1fr); } }
.grid > *, .cols-2 > * { min-width: 0; }

.btn { height: 48px; padding: 0 20px; border: 0; border-radius: var(--r-btn); font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: transform .12s ease, background-color .12s ease, box-shadow .12s ease; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--brand) 75%, transparent); }
.btn-primary:hover:not(:disabled) { background: var(--brand-700); }
.btn-soft { background: var(--brand-50); color: var(--brand-700); }
.btn-soft:hover:not(:disabled) { background: var(--brand-100); }
.btn-ghost { background: var(--sunken); color: var(--ink); }
.btn-ghost:hover:not(:disabled) { background: #E8ECF3; }
.btn-sm { height: 38px; padding: 0 14px; border-radius: 12px; font-size: 14px; }
.btn[aria-busy="true"] { pointer-events: none; }
.btn[aria-busy="true"]::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input { height: 48px; width: 100%; padding: 0 16px; border: 0; border-radius: var(--r-input); background: var(--sunken); font: inherit; color: var(--ink); transition: box-shadow .12s ease, background-color .12s ease; }
.input::placeholder { color: #7B8497; }
.input:hover { background: #EEF1F6; }
.input:focus { outline: none; background: #fff; box-shadow: inset 0 0 0 1.5px var(--brand), var(--ring); }
.input[aria-invalid="true"] { box-shadow: inset 0 0 0 1.5px var(--danger); }
.inline { display: flex; gap: 10px; align-items: end; }
.inline .field { flex: 1; }
@media (max-width: 560px) { .inline { flex-wrap: wrap; } .inline .btn { width: 100%; } }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: var(--r-pill); font-size: 13px; font-weight: 650; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip[data-tone="new"] { color: var(--new); background: var(--new-50); }
.chip[data-tone="ware"] { color: var(--ware); background: var(--ware-50); }
.chip[data-tone="transit"] { color: var(--transit); background: var(--transit-50); }
.chip[data-tone="done"] { color: var(--done); background: var(--done-50); }
.chip[data-tone="bad"] { color: var(--danger); background: var(--danger-50); }

/* Ro‘yxat: bitta oq konteyner, ichida ingichka ajratgichlar (alohida kartalar emas) */
.list { display: grid; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 4px; border-top: 1px solid #EEF1F5; }
.row:first-child { border-top: 0; }
.row-btn { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 10px; margin: 0 -6px; border-radius: 14px; cursor: pointer; }
.row-btn:hover { background: var(--sunken); }
.row-btn[aria-current="true"] { background: var(--brand-50); }
.row-main { min-width: 0; }
.row-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: 13px; color: var(--ink-2); }

.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 28px 12px; color: var(--ink-2); }
.empty-icon { width: 48px; height: 48px; border-radius: 16px; background: var(--sunken); display: grid; place-items: center; color: var(--ink-3); }
.empty-icon svg { width: 24px; height: 24px; }
.empty-title { color: var(--ink); font-weight: 650; }

/* ============ Kirish ============ */
.login { min-height: calc(100vh - 140px); display: grid; place-items: center; }
.login .card { width: min(400px, 100%); padding: 30px; display: grid; gap: 16px; }
.login h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.demo { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip-btn { border: 0; height: 32px; padding: 0 12px; border-radius: var(--r-pill); background: var(--sunken); color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; }
.chip-btn:hover { background: var(--brand-50); color: var(--brand-700); }
.form-error { color: var(--danger); font-size: 14px; font-weight: 500; }

/* ============ Buyurtma: marshrut ============ */
.order-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
.order-code { font-family: var(--mono); font-size: 17px; font-weight: 650; }
.steps { list-style: none; margin: 0 0 24px; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); }
.step { display: grid; justify-items: center; gap: 8px; text-align: center; position: relative; }
.step::before { content: ""; position: absolute; top: 15px; right: 50%; width: 100%; height: 3px; background: #E6EAF1; z-index: 0; }
.step:first-child::before { display: none; }
.step[data-state="done"]::before, .step[data-state="current"]::before, .step[data-state="complete"]::before { background: var(--brand); }
.step-dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #E6EAF1; color: var(--ink-2); font-size: 13px; font-weight: 700; position: relative; z-index: 1; transition: background-color .3s ease, box-shadow .3s ease; }
.step-dot svg { width: 16px; height: 16px; }
.step[data-state="done"] .step-dot { background: var(--brand); color: #fff; }
.step[data-state="current"] .step-dot { background: #fff; color: var(--brand); box-shadow: inset 0 0 0 3px var(--brand), 0 0 0 6px var(--brand-50); }
.step[data-state="complete"] .step-dot { background: var(--done); color: #fff; box-shadow: 0 0 0 6px var(--done-50); }
.step-name { font-size: 14px; font-weight: 650; }
.step[data-state="upcoming"] .step-name { color: var(--ink-2); font-weight: 500; }
.step-time { font-size: 12px; color: var(--ink-2); min-height: 18px; }
.action-bar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; padding: 16px; border-radius: 18px; background: var(--sunken); }
.action-bar .field { flex: 1 1 200px; }
.action-bar .input { background: #fff; }
.action-bar .btn { flex: 0 0 auto; }
.done-note { display: flex; align-items: center; gap: 10px; color: var(--done); font-weight: 600; }
.done-note svg { width: 20px; height: 20px; }
@media (max-width: 560px) {
  .steps { grid-template-columns: 1fr; gap: 14px; }
  .step { grid-template-columns: 32px 1fr; justify-items: start; text-align: left; column-gap: 12px; row-gap: 0; }
  .step::before { display: none; }
  .step-dot { grid-row: span 2; }
  .action-bar .btn { width: 100%; }
}

/* ============ Buyurtmalar: qidiruv, filtr, tafsilotlar ============ */
.create { margin-bottom: 20px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.span-2 { grid-column: span 2; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .span-2 { grid-column: auto; } }
.search { position: relative; margin-bottom: 12px; }
.search > svg { position: absolute; left: 14px; top: 14px; width: 20px; height: 20px; color: var(--ink-2); pointer-events: none; }
.search .input { padding-left: 44px; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; scrollbar-width: none; }
.filter { border: 0; height: 34px; padding: 0 12px; border-radius: var(--r-pill); background: var(--sunken); color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.filter .num { opacity: .7; margin-left: 2px; }
.filter:hover { color: var(--ink); }
.filter[aria-pressed="true"] { background: var(--brand-50); color: var(--brand-700); box-shadow: inset 0 0 0 1.5px var(--brand-100); }
.filter:focus-visible, .link-danger:focus-visible { outline: none; box-shadow: var(--ring); }
.head-actions { display: inline-flex; gap: 8px; align-items: center; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin: 0 0 22px; padding: 16px; background: var(--sunken); border-radius: 18px; }
.facts dt { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.facts dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.facts a { color: var(--brand-700); text-decoration: none; }
.facts a:hover { text-decoration: underline; }
@media (max-width: 560px) { .facts { grid-template-columns: 1fr; } }
.banner { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 16px; font-size: 14px; }
.banner svg { width: 18px; height: 18px; flex: none; }
.banner[data-tone="bad"] { background: var(--danger-50); color: #7A1A12; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #93190F; }
.action-bar[data-tone="bad"] { background: var(--danger-50); }
.link-danger { margin-top: 14px; border: 0; background: none; padding: 4px 0; color: var(--danger); font-weight: 600; font-size: 14px; cursor: pointer; border-radius: 8px; }
.link-danger:hover { text-decoration: underline; }
.deliveries { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.delivery-address { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.delivery-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.delivery-actions .btn { flex: 1; text-decoration: none; }
.done-list { margin-top: 16px; }
.done-list summary { cursor: pointer; font-weight: 650; }

/* ============ Dashboard ============ */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 18px; display: grid; gap: 12px; }
.kpi-icon { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
.kpi-icon svg { width: 20px; height: 20px; }
.kpi-value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi-label { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
@media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg text { font-family: var(--font); fill: var(--ink-2); font-size: 12px; }
.chart svg .label { fill: var(--ink); font-size: 13px; font-weight: 500; }
.chart svg .value { fill: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.chart svg .grid { stroke: #EDF0F5; }
.chart svg .track { fill: var(--sunken); }
.chart svg .hit { fill: transparent; }
.chart svg .hit:focus { outline: none; }
.chart details { margin-top: 10px; font-size: 13px; }
.chart summary { cursor: pointer; color: var(--ink-2); width: max-content; }
.chart table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.chart td, .chart th { text-align: left; padding: 6px 0; border-bottom: 1px solid #EEF1F5; }
.chart th { color: var(--ink-2); font-weight: 600; }
.legend { display: flex; gap: 14px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 500; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.tooltip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: #fff; font-size: 13px; padding: 7px 11px; border-radius: 10px; box-shadow: var(--shadow-pop); white-space: nowrap; }

/* ============ Jurnal, kuzatuv, toast ============ */
.log-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-top: 1px solid #EEF1F5; }
.log-row:first-child { border-top: 0; }
.code-badge { font: 700 12px var(--mono); padding: 4px 0; border-radius: 8px; text-align: center; }
.code-badge[data-ok="true"] { color: var(--done); background: var(--done-50); }
.code-badge[data-ok="false"] { color: var(--danger); background: var(--danger-50); }
.log-row summary { cursor: pointer; list-style: none; }
.log-row summary::-webkit-details-marker { display: none; }
.log-row pre { margin: 8px 0 0; padding: 10px; border-radius: 12px; background: var(--sunken); font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow: auto; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; align-items: start; padding: 10px 0; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 9px; top: 30px; bottom: -8px; width: 2px; background: #E6EAF1; }
.timeline li:last-child::before { display: none; }
.tl-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--brand-50); box-shadow: inset 0 0 0 5px var(--brand); }
.tl-time { font-size: 13px; color: var(--ink-2); }
.toasts { position: fixed; z-index: 40; left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 16px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-pop); animation: toast-in .22s cubic-bezier(.2,.8,.2,1); }
.toast svg { width: 18px; height: 18px; flex: none; }
.toast[data-kind="ok"] svg { color: #6EE7A8; }
.toast[data-kind="error"] svg { color: #FF9C8A; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>
</head>

  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 9M22 21a7 7 0 0 0-4-6.3"/></symbol>

  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-truck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-login" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>

<script>
"use strict";
/* ================= holat va yordamchilar ================= */
const DEMO_PASSWORD = "demo-parol-1";
const DEMO_USERS = [{ username: "op1", role: "operator" }, { username: "ali", role: "courier" }, { username: "vali", role: "courier" }];
const ROLE_NAMES = { admin: "Admin", operator: "Operator", courier: "Kuryer" };
const STEPS = [
  { status: "Yangi",      tone: "new",     action: "receive",  button: "Omborga qabul qilish" },
  { status: "Omborda",    tone: "ware",    action: "dispatch", button: "Yo‘lga chiqarish" },
  { status: "Yo‘lda",     tone: "transit", action: "deliver",  button: "Topshirildi" },
  { status: "Yetkazildi", tone: "done",    action: null },
];
const CANCELLED = "Bekor qilindi";
const CANCELLABLE = ["Yangi", "Omborda"];
const ALL_STATUSES = STEPS.map((s) => s.status).concat(CANCELLED);
const TONE = Object.assign(Object.fromEntries(STEPS.map((s) => [s.status, s.tone])), { [CANCELLED]: "bad" });
const fmtPhone = (p) => { const d = String(p).replace(/\D/g, ""); return d.length === 12 ? `+${d.slice(0, 3)} ${d.slice(3, 5)} ${d.slice(5, 8)} ${d.slice(8, 10)} ${d.slice(10)}` : p; };
const PAGES = {
  login:     { title: "",                  icon: "i-login",   view: "view-login",     label: "Kirish" },
  orders:    { title: "Buyurtmalar",       icon: "i-box",     view: "view-orders",    label: "Buyurtmalar" },
  courier:   { title: "Yetkazmalarim",     icon: "i-truck",   view: "view-courier",   label: "Yetkazmalarim" },
  dashboard: { title: "Dashboard",         icon: "i-chart",   view: "view-dashboard", label: "Dashboard" },
  users:     { title: "Foydalanuvchilar",  icon: "i-users",   view: "view-users",     label: "Foydalanuvchilar" },
  track:     { title: "Kuzatish",          icon: "i-search",  view: "view-track",     label: "Kuzatish" },
  log:       { title: "So‘rovlar jurnali", icon: "i-list",    view: "view-log",       label: "Jurnal" },
};
const ROLE_PAGES = {
  none: ["login", "track", "log"],
  operator: ["orders", "dashboard", "track", "log"],
  admin: ["orders", "dashboard", "users", "track", "log"],
  courier: ["courier", "track", "log"],
};
const state = { token: null, refresh: null, user: null, order: null, assigned: {}, page: "login", logs: [] };
const timers = {};
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (id) => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const chip = (status) => `<span class="chip" data-tone="${TONE[status] || "new"}">${esc(status || "—")}</span>`;
const fmtTime = (iso) => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("uz-UZ", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
const fmtNum = (n) => Number(n).toLocaleString("uz-UZ");
const empty = (iconId, title, text = "") => `<div class="empty"><div class="empty-icon">${icon(iconId)}</div><div class="empty-title">${esc(title)}</div>${text ? `<div>${esc(text)}</div>` : ""}</div>`;

function toast(text, kind = "ok") {
  const el = document.createElement("div");
  el.className = "toast"; el.dataset.kind = kind; el.setAttribute("role", kind === "error" ? "alert" : "status");
  el.innerHTML = `${icon(kind === "error" ? "i-alert" : "i-check")}<span>${esc(text)}</span>`;
  $("toasts").append(el);
  while ($("toasts").children.length > 2) $("toasts").firstElementChild.remove();
  setTimeout(() => el.remove(), kind === "error" ? 5000 : 3000);
}

/* ================= API ================= */
function logEntry(what, method, path, status, body) {
  const shown = { ...body };
  if (shown.access_token) shown.access_token = shown.access_token.slice(0, 20) + "…";
  if (shown.refresh_token) shown.refresh_token = shown.refresh_token.slice(0, 8) + "…";
  state.logs.unshift({ what, method, path, status, body: shown, at: new Date() });
  state.logs.length = Math.min(state.logs.length, 200);
  if (state.page === "log") renderLog();
}

async function api(what, method, path, body, { auth = true, retried = false, quiet = false } = {}) {
  const headers = {};
  if (auth && state.token) headers.Authorization = "Bearer " + state.token;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  let response, data = {};
  try {
    response = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    data = await response.json().catch(() => ({}));
  } catch (_) {
    if (!quiet) logEntry(what, method, path, 0, { error: "Tarmoq xatosi" });
    return { status: 0, data: { error: "Server bilan aloqa yo‘q." } };
  }
  if (response.status === 401 && auth && state.refresh && !retried) {   // access token tugagan — jimgina yangilaymiz
    if (await refreshTokens()) return api(what, method, path, body, { auth, retried: true, quiet });
  }
  if (!quiet) logEntry(what, method, path, response.status, data);
  if (response.status === 401 && auth && state.user) signOut("Sessiya tugadi. Qayta kiring.");
  return { status: response.status, data };
}

async function refreshTokens() {
  const r = await fetch("/api/v1/auth/refresh", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: state.refresh }) });
  const data = await r.json().catch(() => ({}));
  logEntry("Token yangilandi", "POST", "/api/v1/auth/refresh", r.status, data);
  if (r.status !== 200) return false;
  state.token = data.access_token; state.refresh = data.refresh_token;
  return true;
}

async function busy(button, task) {
  if (!button) return task();
  button.disabled = true; button.setAttribute("aria-busy", "true");
  try { return await task(); } finally { button.disabled = false; button.removeAttribute("aria-busy"); }
}

/* ================= navigatsiya ================= */
function render() {
  const role = state.user?.role || "none";
  const pages = ROLE_PAGES[role];
  if (!pages.includes(state.page)) state.page = pages[0];
  $("nav").innerHTML = pages.map((key) => `<button class="nav-item" type="button" data-page="${key}" ${key === state.page ? 'aria-current="page"' : ""}>${icon(PAGES[key].icon)}<span>${PAGES[key].label}</span></button>`).join("");
  $("nav").querySelectorAll("[data-page]").forEach((b) => b.addEventListener("click", () => go(b.dataset.page)));
  $("nav").querySelector('[aria-current="page"]')?.scrollIntoView({ block: "nearest", inline: "nearest" });
  $("me").hidden = !state.user;
  if (state.user) { $("me-name").textContent = state.user.username; $("me-role").textContent = ROLE_NAMES[state.user.role]; $("me-avatar").textContent = state.user.username[0]; }
  Object.entries(PAGES).forEach(([key, p]) => { $(p.view).hidden = key !== state.page; });
  $("page-head").hidden = state.page === "login";
  $("page-title").textContent = PAGES[state.page].title;
  $("page-actions").innerHTML = "";
  Object.values(timers).forEach(clearInterval);
  const loaders = {
    orders: loadOrders, courier: loadCourier, users: loadUsers, log: renderLog,
    dashboard: () => { loadDashboard(); timers.d = setInterval(() => document.hidden || loadDashboard(true), 10000); },
    track: () => $("track-code").focus(), login: () => $("login-user").focus(),
  };
  loaders[state.page]?.();
}
function go(page) { state.page = page; render(); window.scrollTo(0, 0); }

/* ================= kirish ================= */
$("login-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const username = $("login-user").value.trim(), password = $("login-pass").value;
  $("login-user").setAttribute("aria-invalid", String(!username));
  $("login-pass").setAttribute("aria-invalid", String(!password));
  if (!username || !password) return loginError("Login va parolni kiriting.");
  busy($("login-submit"), async () => {
    const { status, data } = await api(`${username} tizimga kirdi`, "POST", "/api/v1/auth/login", { username, password }, { auth: false });
    if (status !== 200) return loginError(status === 429 ? "Juda ko‘p urinish. Bir daqiqadan so‘ng urinib ko‘ring." : "Login yoki parol noto‘g‘ri.");
    loginError("");
    Object.assign(state, { token: data.access_token, refresh: data.refresh_token, user: data.user, page: "" });
    $("login-pass").value = "";
    render();
  });
});
function loginError(text) { $("login-error").hidden = !text; $("login-error").textContent = text; }
document.querySelectorAll("[data-demo]").forEach((b) => b.addEventListener("click", () => {
  $("login-user").value = b.dataset.demo;
  $("login-pass").value = b.dataset.demo === "admin" ? "" : DEMO_PASSWORD;
  (b.dataset.demo === "admin" ? $("login-pass") : $("login-submit")).focus();
}));
$("logout").addEventListener("click", async () => {
  await api("Tizimdan chiqildi", "POST", "/api/v1/auth/logout", { refresh_token: state.refresh }, { auth: false });
  signOut();
});
function signOut(message) {
  Object.assign(state, { token: null, refresh: null, user: null, order: null, page: "login" });
  render();
  if (message) loginError(message);
}

/* ================= buyurtmalar ================= */
const ORDER_PAGE = 20;
const listState = { status: "", q: "", offset: 0, items: [], total: 0, counts: {} };

function showCreate(show) {
  $("order-form").hidden = !show;
  if (show) { $("order-error").hidden = true; $("order-name").focus(); }
}
$("order-form-close").addEventListener("click", () => showCreate(false));
$("order-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const fields = { recipient_name: $("order-name"), recipient_phone: $("order-phone"), address: $("order-address") };
  const body = Object.fromEntries(Object.entries(fields).map(([k, el]) => [k, el.value.trim()]));
  let firstEmpty = null;
  Object.entries(fields).forEach(([k, el]) => { el.setAttribute("aria-invalid", String(!body[k])); if (!body[k] && !firstEmpty) firstEmpty = el; });
  if (firstEmpty) return firstEmpty.focus();
  busy(event.submitter, async () => {
    const { status, data } = await api("Buyurtma yaratildi", "POST", "/api/v1/orders", body);
    if (status !== 201) { $("order-error").hidden = false; $("order-error").textContent = data.error || "Buyurtma yaratilmadi."; return; }
    Object.values(fields).forEach((el) => { el.value = ""; });
    showCreate(false);
    toast("Buyurtma yaratildi");
    await openOrder(data.code);
    loadList();
  });
});

function loadOrders() {
  $("page-actions").innerHTML = `<button class="btn btn-primary" type="button" id="new-order">${icon("i-plus")}Yangi buyurtma</button>`;
  $("new-order").addEventListener("click", () => showCreate(true));
  renderOrder();
  loadList();
}

let searchTimer;
$("order-search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { listState.q = e.target.value.trim(); loadList(); }, 250);
});
$("orders-more").addEventListener("click", (e) => busy(e.currentTarget, () => loadList(true)));

async function loadList(more = false) {
  listState.offset = more ? listState.items.length : 0;
  const params = new URLSearchParams({ limit: ORDER_PAGE, offset: listState.offset });
  if (listState.status) params.set("status", listState.status);
  if (listState.q) params.set("q", listState.q);
  const { status, data } = await api("Buyurtmalar ro‘yxati", "GET", `/api/v1/orders?${params}`, undefined, { quiet: true });
  if (status !== 200) return;
  listState.items = more ? listState.items.concat(data.items) : data.items;
  listState.total = data.total; listState.counts = data.counts;
  renderFilters(); renderList();
}

function renderFilters() {
  const all = Object.values(listState.counts).reduce((a, b) => a + b, 0);
  const opts = [["", "Hammasi", all], ...ALL_STATUSES.map((s) => [s, s, listState.counts[s] || 0])];
  $("filters").innerHTML = opts.map(([value, label, n]) =>
    `<button class="filter" type="button" data-status="${esc(value)}" aria-pressed="${listState.status === value}">${esc(label)} <span class="num">${n}</span></button>`).join("");
  $("filters").querySelectorAll("[data-status]").forEach((b) => b.addEventListener("click", () => { listState.status = b.dataset.status; loadList(); }));
}

function renderList() {
  const box = $("orders-list");
  $("orders-more").hidden = listState.items.length >= listState.total;
  if (!listState.items.length) {
    box.innerHTML = listState.q || listState.status ? empty("i-search", "Hech narsa topilmadi") : empty("i-box", "Buyurtmalar yo‘q", "«Yangi buyurtma» tugmasini bosing.");
    return;
  }
  box.innerHTML = listState.items.map((o) => `<button class="row-btn" type="button" data-open="${esc(o.code)}" ${state.order?.code === o.code ? 'aria-current="true"' : ""}>
    <span class="row-main"><span class="row-title">${esc(o.recipient_name || "—")}</span><br><span class="row-sub mono">${esc(o.code)}</span></span>${chip(o.status)}</button>`).join("");
  box.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", async () => { await openOrder(b.dataset.open); renderList(); }));
}

async function openOrder(code) {
  const { status, data } = await api("Buyurtma ochildi", "GET", `/api/v1/orders/${encodeURIComponent(code)}`);
  if (status === 200) { state.order = data; state.cancelling = false; renderOrder(); }
  else toast(data.error || "Buyurtma topilmadi.", "error");
}

const trackUrl = (code) => `${location.origin}/?track=${encodeURIComponent(code)}`;
async function copyLink(code) {
  try { await navigator.clipboard.writeText(trackUrl(code)); toast("Kuzatuv havolasi nusxalandi"); }
  catch (_) { prompt("Havolani nusxalang:", trackUrl(code)); }
}

function renderOrder() {
  const card = $("order-card"), order = state.order;
  if (!order) { card.innerHTML = empty("i-box", "Buyurtma tanlanmagan", "Ro‘yxatdan tanlang yoki yangisini yarating."); return; }
  const cancelled = order.status === CANCELLED;
  const index = STEPS.findIndex((s) => s.status === order.status), step = STEPS[index];
  const times = Object.fromEntries(order.history.map((h) => [h.status, h.created_at]));
  const phone = order.recipient_phone;
  const facts = `<dl class="facts">
    <div><dt>Qabul qiluvchi</dt><dd>${esc(order.recipient_name || "—")}</dd></div>
    <div><dt>Telefon</dt><dd>${phone ? `<a class="num" href="tel:${esc(phone)}">${esc(fmtPhone(phone))}</a>` : "—"}</dd></div>
    <div class="span-2"><dt>Manzil</dt><dd>${esc(order.address)}</dd></div>
    <div><dt>Kuryer</dt><dd>${esc(order.courier || "Biriktirilmagan")}</dd></div>
    <div><dt>Yaratilgan</dt><dd>${esc(fmtTime(order.created_at))}</dd></div></dl>`;
  let body;
  if (cancelled) {
    body = `<div class="banner" data-tone="bad">${icon("i-x")}<span><b>Bekor qilindi</b>${order.cancel_reason ? `: ${esc(order.cancel_reason)}` : ""}</span></div>`;
  } else {
    const steps = STEPS.map((s, i) => {
      const finished = i === index && !s.action;
      const st = i < index ? "done" : finished ? "complete" : i === index ? "current" : "upcoming";
      return `<li class="step" data-state="${st}" ${i === index ? 'aria-current="step"' : ""}>
        <span class="step-dot">${st === "done" || st === "complete" ? icon("i-check") : i + 1}</span>
        <span class="step-name">${esc(s.status)}</span><span class="step-time">${esc(fmtTime(times[s.status]))}</span></li>`;
    }).join("");
    let action;
    if (!step.action) action = `<div class="done-note">${icon("i-check")} Mijozga topshirildi</div>`;
    else if (state.cancelling) {
      action = `<div class="action-bar" data-tone="bad">
        <div class="field"><label for="cancel-reason">Bekor qilish sababi</label><input class="input" id="cancel-reason" maxlength="200" placeholder="Mijoz rad etdi"></div>
        <button class="btn btn-ghost" type="button" id="cancel-back">Orqaga</button>
        <button class="btn btn-danger" type="button" id="cancel-confirm">Bekor qilish</button></div>`;
    } else {
      const courier = step.action === "dispatch" && !order.courier
        ? `<div class="field"><label for="assign-courier">Kuryer</label><input class="input" id="assign-courier" placeholder="ali" autocomplete="off"></div>
           <button class="btn btn-soft" type="button" id="assign-btn">Biriktirish</button>` : "";
      action = `<div class="action-bar">${courier}<button class="btn btn-primary" type="button" id="step-btn">${esc(step.button)}</button></div>`;
    }
    body = `<ol class="steps" aria-label="Buyurtma bosqichlari">${steps}</ol>${action}`;
  }
  const canCancel = !cancelled && CANCELLABLE.includes(order.status) && !state.cancelling;
  card.innerHTML = `<div class="order-head"><span class="order-code">${esc(order.code)}</span>
      <span class="head-actions">${chip(order.status)}
        <button class="icon-btn" type="button" id="copy-link" aria-label="Kuzatuv havolasini nusxalash" title="Kuzatuv havolasini nusxalash" style="margin:0">${icon("i-link")}</button></span></div>
    ${facts}${body}
    ${canCancel ? `<button class="link-danger" type="button" id="cancel-open">Buyurtmani bekor qilish</button>` : ""}`;
  $("copy-link").addEventListener("click", () => copyLink(order.code));
  $("step-btn")?.addEventListener("click", (e) => busy(e.currentTarget, () => advance(step)));
  $("assign-btn")?.addEventListener("click", (e) => busy(e.currentTarget, assignCourier));
  $("assign-courier")?.addEventListener("keydown", (e) => { if (e.key === "Enter") $("assign-btn").click(); });
  $("cancel-open")?.addEventListener("click", () => { state.cancelling = true; renderOrder(); $("cancel-reason").focus(); });
  $("cancel-back")?.addEventListener("click", () => { state.cancelling = false; renderOrder(); });
  $("cancel-confirm")?.addEventListener("click", (e) => busy(e.currentTarget, cancelOrder));
}

async function cancelOrder() {
  const code = state.order.code;
  const { status, data } = await api("Buyurtma bekor qilindi", "POST", `/api/v1/orders/${encodeURIComponent(code)}/cancel`, { reason: $("cancel-reason").value.trim() });
  if (status !== 200) return toast(data.error || "Bekor qilinmadi.", "error");
  toast("Buyurtma bekor qilindi");
  await openOrder(code);
  loadList();
}

async function advance(step) {
  const code = state.order.code;
  const { status, data } = await api(step.button, "POST", `/api/v1/orders/${encodeURIComponent(code)}/${step.action}`);
  if (status !== 200) return toast(data.error || "Amal bajarilmadi.", "error");
  toast(`Holat: ${data.status}`);
  await openOrder(code);
  loadList();
}

async function assignCourier() {
  const input = $("assign-courier"), courier = input.value.trim().toLowerCase();
  if (!courier) { input.setAttribute("aria-invalid", "true"); return input.focus(); }
  const code = state.order.code;
  const { status, data } = await api(`Kuryer ${courier} biriktirildi`, "POST", `/api/v1/orders/${encodeURIComponent(code)}/assign`, { courier });
  if (status !== 200) return toast(data.error || "Kuryer biriktirilmadi.", "error");
  toast(`${courier} biriktirildi`);
  await openOrder(code);
}

/* ================= kuryer ================= */
async function loadCourier() {
  const { status, data } = await api("Yetkazmalar", "GET", "/api/v1/couriers/me/assignments");
  if (status !== 200) return;
  const details = await Promise.all(data.items.map(async (item) => {
    const r = await api("Buyurtma", "GET", `/api/v1/orders/${encodeURIComponent(item.code)}`, undefined, { quiet: true });
    return r.status === 200 ? r.data : { code: item.code, status: "—" };
  }));
  const active = details.filter((o) => o.status === "Omborda" || o.status === "Yo‘lda");
  const done = details.filter((o) => !active.includes(o));
  $("courier-list").innerHTML = active.length ? active.map((o) => `<article class="card delivery">
      <div class="order-head" style="margin-bottom:12px"><span class="row-title">${esc(o.recipient_name || "—")}</span>${chip(o.status)}</div>
      <p class="delivery-address">${esc(o.address || "")}</p>
      <p class="row-sub mono">${esc(o.code)}</p>
      <div class="delivery-actions">
        ${o.recipient_phone ? `<a class="btn btn-soft" href="tel:${esc(o.recipient_phone)}">${icon("i-phone")}Qo‘ng‘iroq</a>` : ""}
        ${o.status === "Yo‘lda" ? `<button class="btn btn-primary" type="button" data-deliver="${esc(o.code)}">Topshirildi</button>`
          : `<span class="row-sub">Ombordan olib ketishni kuting</span>`}
      </div></article>`).join("")
    : `<div class="card">${empty("i-truck", "Faol yetkazma yo‘q")}</div>`;
  $("courier-done").hidden = !done.length;
  $("courier-done-list").innerHTML = done.map((o) => `<div class="row"><span class="row-main"><span class="row-title">${esc(o.recipient_name || o.code)}</span><br><span class="row-sub mono">${esc(o.code)}</span></span>${chip(o.status)}</div>`).join("");
  $("courier-list").querySelectorAll("[data-deliver]").forEach((b) => b.addEventListener("click", (e) => busy(e.currentTarget, async () => {
    const { status, data } = await api("Buyurtma topshirildi", "POST", `/api/v1/orders/${encodeURIComponent(b.dataset.deliver)}/deliver`);
    status === 200 ? toast("Topshirildi") : toast(data.error || "Topshirilmadi.", "error");
    loadCourier();
  })));
}

/* ================= foydalanuvchilar ================= */
async function loadUsers() {
  const { status, data } = await api("Foydalanuvchilar", "GET", "/api/v1/auth/users", undefined, { quiet: true });
  if (status !== 200) return;
  $("users").innerHTML = data.items.map((u) => `<div class="row"><span class="row-main" style="display:flex;gap:12px;align-items:center">
    <span class="avatar">${esc(u.username[0])}</span><span><span class="row-title">${esc(u.username)}</span><br><span class="row-sub">${esc(ROLE_NAMES[u.role] || u.role)}</span></span></span>
    ${u.active ? "" : `<span class="chip" data-tone="bad">Bloklangan</span>`}</div>`).join("");
}
$("user-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const body = { username: $("user-name").value.trim(), password: $("user-pass").value, role: $("user-role").value };
  busy(event.submitter, async () => {
    const { status, data } = await api(`Foydalanuvchi ${body.username} yaratildi`, "POST", "/api/v1/auth/users", body);
    if (status !== 201) return toast(data.error || "Yaratilmadi.", "error");
    $("user-name").value = ""; $("user-pass").value = "";
    toast(`${data.username} yaratildi`);
    loadUsers();
  });
});
$("seed-demo").addEventListener("click", (e) => busy(e.currentTarget, async () => {
  for (const u of DEMO_USERS) await api(`Namoyish hisobi ${u.username}`, "POST", "/api/v1/auth/users", { ...u, password: DEMO_PASSWORD });
  toast(`op1, ali, vali tayyor. Parol: ${DEMO_PASSWORD}`);
  loadUsers();
}));

/* ================= kuzatish ================= */
$("track-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const code = $("track-code").value.trim();
  if (!code) return $("track-code").focus();
  busy(event.submitter, async () => {
    const { status, data } = await api("Ommaviy kuzatuv", "GET", `/api/v1/tracking/${encodeURIComponent(code)}`, undefined, { auth: false });
    const box = $("track-result"); box.hidden = false;
    if (status !== 200) { box.innerHTML = empty("i-search", "Topilmadi", "Kodni tekshiring."); return; }
    const names = { "order.created": "Yaratildi", "order.status_changed": "Holat o‘zgardi", "courier.assigned": "Kuryer biriktirildi" };
    box.innerHTML = `<div class="order-head"><span class="order-code">${esc(data.code)}</span>${chip(data.status)}</div>
      <ol class="timeline">${data.timeline.map((t) => `<li><span class="tl-dot"></span><span style="font-weight:600">${esc(t.status || names[t.event] || t.event)}</span><span class="tl-time">${esc(fmtTime(t.at))}</span></li>`).join("")}</ol>`;
  });
});

/* ================= jurnal ================= */
function renderLog() {
  const box = $("log");
  if (!state.logs.length) { box.innerHTML = empty("i-list", "So‘rovlar yo‘q"); return; }
  box.innerHTML = state.logs.map((l) => `<div class="log-row"><span class="code-badge" data-ok="${l.status > 0 && l.status < 400}">${l.status || "—"}</span>
    <details><summary><span class="row-title">${esc(l.what)}</span><br><span class="row-sub mono">${esc(l.method)} ${esc(l.path)}</span></summary><pre>${esc(JSON.stringify(l.body, null, 2))}</pre></details>
    <span class="tl-time num">${l.at.toLocaleTimeString("uz-UZ")}</span></div>`).join("");
}

/* ================= grafiklar (SVG, kutubxonasiz) ================= */
const COLORS = { new: "#5B6676", ware: "#9A6300", transit: "#1F55C7", done: "#137344", bad: "#B42318", brand: "#2C62DE" };
function fmtDuration(seconds) {
  if (seconds == null) return "—";
  const s = Math.round(seconds);
  if (s < 60) return `${s} s`;
  if (s < 3600) return `${Math.floor(s / 60)} daq`;
  return `${Math.floor(s / 3600)} soat ${Math.floor((s % 3600) / 60)} daq`;
}
const niceMax = (v) => { if (v <= 4) return Math.max(1, Math.ceil(v)); const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return v; };
const hBar = (x, y, w, h, r = 7) => { if (w <= 0) return ""; r = Math.min(r, w, h / 2); return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`; };
const col = (x, b, w, h, r = 5) => { if (h <= 0) return ""; r = Math.min(r, h, w / 2); const t = b - h; return `M${x},${b}V${t + r}Q${x},${t} ${x + r},${t}H${x + w - r}Q${x + w},${t} ${x + w},${t + r}V${b}Z`; };
const tableView = (heads, rows) => `<details><summary>Jadval</summary><table><tr>${heads.map((h) => `<th>${esc(h)}</th>`).join("")}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></details>`;

function barChart(el, rows, format, heads) {
  const W = 480, labelW = 92, valueW = 70, barH = 14, gap = 22;
  const H = rows.length * (barH + gap) - gap + 2, max = Math.max(...rows.map((r) => r.value || 0), 0), plot = W - labelW - valueW;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(rows.map((r) => `${r.label}: ${format(r.value)}`).join("; "))}">${rows.map((r, i) => {
    const y = i * (barH + gap), w = max ? (r.value || 0) / max * plot : 0;
    return `<text class="label" x="0" y="${y + barH - 2}">${esc(r.label)}</text><rect class="track" x="${labelW}" y="${y}" width="${plot}" height="${barH}" rx="7"/>
      <path d="${hBar(labelW, y, w, barH)}" fill="${r.color}"/><text class="value" x="${W}" y="${y + barH - 2}" text-anchor="end">${esc(format(r.value))}</text>
      <rect class="hit" x="0" y="${y - gap / 2}" width="${W}" height="${barH + gap}" tabindex="0" data-tip="${esc(r.label)}: <b>${esc(format(r.value))}</b>"/>`;
  }).join("")}</svg>` + tableView(heads, rows.map((r) => [r.label, format(r.value)]));
}

function columnChart(el, points) {
  const W = 480, H = 190, left = 26, bottom = 22, plotH = H - bottom - 6, plotW = W - left;
  const max = niceMax(Math.max(...points.map((p) => p.count), 0)), slot = plotW / points.length, bw = Math.min(12, slot * .6);
  const ticks = [0, max].map((t) => { const y = 6 + plotH - t / max * plotH; return `<line class="grid" x1="${left}" x2="${W}" y1="${y}" y2="${y}"/><text x="${left - 8}" y="${y + 4}" text-anchor="end">${t}</text>`; }).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Oxirgi 24 soat: ${points.reduce((a, p) => a + p.count, 0)} ta buyurtma">${ticks}${points.map((p, i) => {
    const x = left + i * slot + (slot - bw) / 2, h = p.count / max * plotH, hour = new Date(p.hour).toLocaleTimeString("uz-UZ", { hour: "2-digit", minute: "2-digit" });
    return `<path d="${col(x, 6 + plotH, bw, h)}" fill="${COLORS.brand}"/>${i % 6 === 0 || i === points.length - 1 ? `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${hour}</text>` : ""}
      <rect class="hit" x="${left + i * slot}" y="6" width="${slot}" height="${plotH}" data-tip="${hour}: <b>${p.count}</b>"/>`;
  }).join("")}</svg>` + tableView(["Soat", "Soni"], points.filter((p) => p.count).map((p) => [fmtTime(p.hour), p.count]));
}

function courierChart(el, items) {
  if (!items.length) { el.innerHTML = empty("i-truck", "Ma’lumot yo‘q"); return; }
  const W = 480, labelW = 92, valueW = 40, barH = 14, gap = 22, H = items.length * (barH + gap) - gap + 2;
  const max = Math.max(...items.map((c) => c.assigned)), plot = W - labelW - valueW;
  el.innerHTML = `<div class="legend" style="margin-bottom:14px"><span><i style="background:${COLORS.done}"></i>Topshirilgan</span><span><i style="background:${COLORS.transit}"></i>Qo‘lida</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(items.map((c) => `${c.courier}: ${c.delivered} topshirilgan, ${c.active} qo‘lida`).join("; "))}">${items.map((c, i) => {
      const y = i * (barH + gap), wd = c.delivered / max * plot, wa = c.active / max * plot, g = wd && wa ? 2 : 0;
      const left = wd ? (wa ? `<path d="M${labelW + 7},${y}H${labelW + wd}V${y + barH}H${labelW + 7}Q${labelW},${y + barH} ${labelW},${y + barH - 7}V${y + 7}Q${labelW},${y} ${labelW + 7},${y}Z" fill="${COLORS.done}"/>`
                                 : `<rect x="${labelW}" y="${y}" width="${wd}" height="${barH}" rx="7" fill="${COLORS.done}"/>`) : "";
      const right = wa ? (wd ? `<path d="${hBar(labelW + wd + g, y, wa - g, barH)}" fill="${COLORS.transit}"/>` : `<rect x="${labelW}" y="${y}" width="${wa}" height="${barH}" rx="7" fill="${COLORS.transit}"/>`) : "";
      return `<text class="label" x="0" y="${y + barH - 2}">${esc(c.courier)}</text><rect class="track" x="${labelW}" y="${y}" width="${plot}" height="${barH}" rx="7"/>${left}${right}
        <text class="value" x="${W}" y="${y + barH - 2}" text-anchor="end">${c.assigned}</text>
        <rect class="hit" x="0" y="${y - gap / 2}" width="${W}" height="${barH + gap}" tabindex="0" data-tip="${esc(c.courier)}: <b>${c.delivered}</b> topshirilgan, <b>${c.active}</b> qo‘lida"/>`;
    }).join("")}</svg>` + tableView(["Kuryer", "Topshirilgan", "Qo‘lida"], items.map((c) => [c.courier, c.delivered, c.active]));
}

const tooltip = $("tooltip");
function showTip(t, x, y) { tooltip.innerHTML = t.dataset.tip; tooltip.hidden = false; const r = tooltip.getBoundingClientRect(); tooltip.style.left = `${Math.min(x + 14, innerWidth - r.width - 8)}px`; tooltip.style.top = `${Math.max(8, y - r.height - 12)}px`; }
document.addEventListener("mousemove", (e) => { const t = e.target.closest?.("[data-tip]"); t ? showTip(t, e.clientX, e.clientY) : (tooltip.hidden = true); });
document.addEventListener("focusin", (e) => { const t = e.target.closest?.("[data-tip]"); if (t) { const b = t.getBoundingClientRect(); showTip(t, b.left + b.width / 2, b.top); } });
document.addEventListener("focusout", () => { tooltip.hidden = true; });
document.addEventListener("scroll", () => { tooltip.hidden = true; }, true);

/* ================= dashboard ================= */
async function loadDashboard(quiet = false) {
  const [o, c] = await Promise.all([api("Dashboard", "GET", "/api/v1/stats", undefined, { quiet }), api("Kuryerlar", "GET", "/api/v1/couriers/stats", undefined, { quiet })]);
  if (o.status !== 200) return;
  const d = o.data, by = d.by_status, share = d.total ? Math.round(by["Yetkazildi"] / d.total * 100) : 0;
  const kpi = (iconId, tone, value, label) => `<div class="card kpi"><span class="kpi-icon" style="background:var(--${tone}-50);color:var(--${tone})">${icon(iconId)}</span>
    <div><div class="kpi-value">${esc(value)}</div><div class="kpi-label">${esc(label)}</div></div></div>`;
  $("kpis").innerHTML = kpi("i-box", "brand", fmtNum(d.total), "Jami buyurtmalar") + kpi("i-truck", "transit", fmtNum(by["Yo‘lda"]), "Yo‘lda")
    + kpi("i-check", "done", `${share}%`, "Yetkazilgan") + kpi("i-clock", "ware", fmtDuration(d.delivery_avg_seconds), "O‘rtacha yetkazish");
  if (!d.total) { ["chart-status", "chart-hourly", "chart-stages"].forEach((id) => { $(id).innerHTML = empty("i-chart", "Ma’lumot yo‘q"); }); }
  else {
    barChart($("chart-status"), STEPS.map((s) => ({ label: s.status, value: by[s.status], color: COLORS[s.tone] }))
      .concat({ label: "Bekor", value: by[CANCELLED] || 0, color: COLORS.bad }), fmtNum, ["Holat", "Soni"]);
    columnChart($("chart-hourly"), d.created_per_hour);
    barChart($("chart-stages"), [["receive", "Omborda", "ware"], ["dispatch", "Yo‘lda", "transit"], ["deliver", "Yetkazildi", "done"]]
      .map(([a, label, tone]) => ({ label, value: d.stage_avg_seconds[a], color: COLORS[tone] })), fmtDuration, ["Bosqich", "O‘rtacha"]);
  }
  courierChart($("chart-couriers"), c.status === 200 ? c.data.items : []);
}


// Mijozga yuborilgan havola: /?track=CRY-… — kuzatuv sahifasi kod bilan darhol ochiladi.

if (deepLink) { state.page = "track"; render(); $("track-code").value = deepLink; $("track-form").requestSubmit(); }
else render();
